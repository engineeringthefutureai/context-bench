# Near-miss decoys (repo M only): plausible but wrong for tasks that need the helper.
# Swapping any of them into the reference solution fails the hidden tests (verified).
[[decoy]]
qualname = "shopkit.utils.legacy.old_slugify"          # underscores, keeps accents
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.marketing.campaigns.campaign_handle"   # underscores, truncated to 30
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.shipping.labels.label_code"        # no dashes between groups
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
qualname = "shopkit.utils.legacy.legacy_sku"           # keeps separators as typed
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
qualname = "shopkit.reports.formatting.fmt_amount"     # no symbol, no grouping
looks_like = "shopkit.money.format_money"

[[decoy]]
qualname = "shopkit.utils.legacy.cents_to_str"         # float formatting, no symbol
looks_like = "shopkit.money.format_money"

# Dead code paths, for the legacy metrics (legacy_ctx_share, legacy_used). Harness-only: never shown
# to the model.
[legacy]
paths = ["shopkit/legacy_v1/"]

# Dead legacy code (shopkit/legacy_v1/, nothing imports it): 2017 style that clashes with the rest
# (camelCase, float dollars, %-formatting, globals, bare except). Tests whether a strategy surfaces it
# and whether the model calls it or copies its style. These look-alikes also fail the hidden tests.
[[decoy]]
qualname = "shopkit.legacy_v1.StringUtils.makeSlug"         # drops accented letters, keeps leading/trailing dashes
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.legacy_v1.StringUtils.cleanSKU"         # no dash between letter/digit groups
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
qualname = "shopkit.legacy_v1.StringUtils.formatPrice"      # float dollars, no thousands separator
looks_like = "shopkit.money.format_money"

[[decoy]]
qualname = "shopkit.legacy_v1.StringUtils.isEmail"          # only checks for '@' and '.'
looks_like = "shopkit.utils.validation.is_valid_email"

[[decoy]]
qualname = "shopkit.legacy_v1.date_helpers.addWorkDays"     # unix timestamps, ignores holidays
looks_like = "shopkit.utils.dates.add_business_days"

[[decoy]]
qualname = "shopkit.legacy_v1.report_gen.paginateList"      # 0-based pages, no metadata
looks_like = "shopkit.api.pagination.paginate"

[[decoy]]
qualname = "shopkit.legacy_v1.TaxHelper.calcTax"            # float dollars, US states only
looks_like = "shopkit.tax.calculator.tax_for"

[[decoy]]
qualname = "shopkit.legacy_v1.CustomerUtils.maskCard"       # fixed 16-digit layout
looks_like = "shopkit.payments.reconciliation.redact_pan"

[[decoy]]
qualname = "shopkit.legacy_v1.inventory_sync.splitIntoBatches"
looks_like = "shopkit.utils.collections.chunked"
