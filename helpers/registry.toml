# Planted helpers. Target: 25 (half `matching` names, half `opaque`).
# naming = "matching": task wording shares tokens with the name (grep can find it)
# naming = "opaque":   task wording doesn't (only semantic retrieval / exploration can)
# fuzz = strategy name in context_bench/evaluate/fuzz.py

[[helper]]
qualname = "shopkit.utils.text.normalize_sku"
fuzz = "sku_strings"
naming = "opaque"

[[helper]]
qualname = "shopkit.money.format_money"
fuzz = "money_cents"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.text.slug_for_title"
fuzz = "titles"
naming = "matching"
