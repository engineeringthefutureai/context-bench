# Trap helper (repo M, trap-001): signature and docstring promise unit="lb", the body ignores it
# (drift after a refactor). Correct use = reuse it and fix it.
[[helper]]
qualname = "shopkit.shipping.packaging.format_weight"
naming = "matching"
trap = true

[[decoy]]
qualname = "shopkit.common.shipping_calc.kgToLbs"      # factor 2.2: 10 kg -> 22.00 lb, not 22.05
looks_like = "shopkit.shipping.packaging.format_weight"

# Near-miss decoys (repo M only): plausible but wrong for tasks that need the helper.
# Swapping any of them into the reference solution fails the hidden tests (verified).
[[decoy]]
qualname = "shopkit.utils.strings.slugify"            # underscores, keeps accents; dead (tests only)
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.marketing.campaigns.campaign_handle"   # underscores, truncated to 30
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.shipping.labels.label_code"        # no dashes between groups
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
qualname = "shopkit.utils.strings.sku_code"           # keeps separators as typed; dead (tests only)
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
