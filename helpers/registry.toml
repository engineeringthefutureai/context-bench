# Planted helpers in shopkit (repo S has the first three; repo M has all 25).
# naming = "matching": likely task wording shares tokens with the name (grep can find it)
# naming = "opaque":   it doesn't (only semantic retrieval / exploration finds it)
# 13 matching / 12 opaque; 9 in utils/, 16 in domain modules. Each is called at least once in M
# (in its own module or elsewhere), so it looks like live code, not a planted orphan.

# ---- utils/
[[helper]]
qualname = "shopkit.utils.text.normalize_sku"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.text.slug_for_title"
naming = "matching"

[[helper]]
qualname = "shopkit.utils.dates.add_business_days"
naming = "matching"

[[helper]]
qualname = "shopkit.utils.dates.iso_week_label"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.collections.chunked"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.collections.index_by"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.validation.is_valid_email"
naming = "matching"

[[helper]]
qualname = "shopkit.utils.ids.short_code"
naming = "opaque"

[[helper]]
qualname = "shopkit.utils.numbers.apply_rate"
naming = "opaque"

