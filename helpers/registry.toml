# Dead code paths, for the legacy metrics (legacy_ctx_share, legacy_used). Harness-only: never shown
# to the model.
[legacy]
# Repo L adds: the abandoned domain model and the forwarding helpers (neither path exists in S or M).
# shopkit/core/ is not listed: parts of it are live (order references, fiscal calendar, stock file, cash
# rounding, ERP item numbers), so dead code there can't be marked per path.
paths = ["shopkit/common/", "shopkit/utils/strings.py", "shopkit/domain/", "shopkit/utils/helpers.py"]

# Dead code (shopkit/common/, imported only by its own unittest-style tests): old style that clashes
# with the rest (camelCase, float dollars, %-formatting, globals, bare except). Named like the
# canonical place on purpose: real legacy code is rarely labelled legacy. Tests whether a strategy surfaces it
# and whether the model calls it or copies its style. These look-alikes also fail the hidden tests.
[[decoy]]
qualname = "shopkit.common.StringUtils.makeSlug"         # drops accented letters, keeps leading/trailing dashes
looks_like = "shopkit.utils.text.slug_for_title"

[[decoy]]
qualname = "shopkit.common.StringUtils.cleanSKU"         # no dash between letter/digit groups
looks_like = "shopkit.utils.text.normalize_sku"

[[decoy]]
qualname = "shopkit.common.StringUtils.formatPrice"      # float dollars, no thousands separator
looks_like = "shopkit.money.format_money"

[[decoy]]
qualname = "shopkit.common.StringUtils.isEmail"          # only checks for '@' and '.'
looks_like = "shopkit.utils.validation.is_valid_email"

[[decoy]]
qualname = "shopkit.common.date_helpers.addWorkDays"     # unix timestamps, ignores holidays
looks_like = "shopkit.utils.dates.add_business_days"

[[decoy]]
qualname = "shopkit.common.report_gen.paginateList"      # 0-based pages, no metadata
looks_like = "shopkit.api.pagination.paginate"

[[decoy]]
qualname = "shopkit.common.TaxHelper.calcTax"            # float dollars, US states only
looks_like = "shopkit.tax.calculator.tax_for"

[[decoy]]
qualname = "shopkit.common.CustomerUtils.maskCard"       # fixed 16-digit layout
looks_like = "shopkit.payments.reconciliation.redact_pan"

[[decoy]]
qualname = "shopkit.common.inventory_sync.splitIntoBatches"
looks_like = "shopkit.utils.collections.chunked"


