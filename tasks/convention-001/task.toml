id = "convention-001"
category = "convention"
tier = 5   # convention: the error-reporting pattern lives in other files (errors.py, api/handlers.py)
target_file = "shopkit/inventory/stock.py"
needed_helpers = []
# Passing requires raising a ShopError subclass with http_status 409 (e.g. a Conflict subclass)
# and passing requested/available as details. stock.py imports nothing from the project.

prompt = """
Checkout needs to hold stock for an order. Add `Stock.reserve(sku, qty)` that lowers the
available quantity of `sku` by `qty`. If there isn't enough stock, nothing changes and the
request fails the same way other business-rule failures in the shop do, so that the API answers
with 409 and the error body includes the requested and available quantities as `requested` and
`available`.
"""
