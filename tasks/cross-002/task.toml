# cross-file: catalog/models.py (field), orders/fulfillment.py (parcel_weight_g), api/serializers.py
# (product dict). catalog/models.py imports neither; L1/L2 can't see them.

prompt = """
Products now have a shipping weight. Add `weight_g: int = 0` (grams per unit) to `Product`. Add
`parcel_weight_g(parcel, products)` to the fulfillment module: the total weight of a parcel's
contents, where `products` maps SKU to product. The product representation the API returns must
include the weight as `weight_g`.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
Products get a weight field, the fulfillment module gets a new function, and the API's product dict has to include the weight. The target imports none of those three files, so a level that sees only the target and its imports is expected to miss at least one. An agent that searches the repository should be able to find all three.
"""
