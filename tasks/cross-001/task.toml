id = "cross-001"
category = "cross_file"
tier = 6   # cross-file: one feature, coordinated edits in models.py, invoices/render.py, orders/export.py
target_file = "shopkit/orders/models.py"
needed_helpers = []
# Neither render.py nor export.py is imported by models.py; L1/L2 can't see them.

prompt = """
Orders can now carry a percentage discount. Add `discount_percent: int = 0` (0 to 100) to orders.
The order total must reflect the discount; the discount amount is rounded down to whole cents.
Customer invoices must show the discount amount on its own line just before the total (only for
discounted orders; undiscounted invoices stay exactly as they are today). The warehouse JSON
export must include the discount as `discount_percent`.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
One feature touches three files. The order model gets the field and a total with the discount rounded down to whole cents. The invoice gets a discount line just before the total, for discounted orders only, and the warehouse export gets the percentage. The model imports neither the renderer nor the export. Undiscounted invoices must come out exactly as before.
"""
