id = "control-L01"
category = "control"
tier = 2   # local edit in a long target file: everything needed is in it
target_file = "shopkit/core/order_engine.py"
needed_helpers = []
repo_sizes = ["L"]

prompt = """
Ops wants readable warehouse states on the phone-order screen. In the order engine module add
`wmsStatusLabel(code)` that returns a short English label for each status code the warehouse sends:
received -> "Received", allocated -> "Allocated", picking -> "Picking", packed -> "Packed",
dispatched -> "Dispatched", short pick -> "Short pick", cancelled -> "Cancelled", on hold ->
"On hold". Codes are matched case-insensitively and surrounding spaces are ignored; anything else
(including None) gives "Unknown".
"""

# For the Tasks page (scripts/build_site.py). Not part of the prompt the models get.
notes = """
The warehouse sends three-letter codes: RCV, ALC, PCK, PKD, DSP, SHT, CNL and HLD. The target module defines them as WMS_STATUS_* constants, and the function right above the new one uses them. The task names the statuses in words ("received -> Received"), and that reads like a table of codes too.

The intended reading takes the codes from the module, and the hidden tests check those. Mapping the words is a plausible reading of the prompt on its own, so the task also tests whether the model checks the prompt against the code. The ambiguity is mild and has been kept as it is.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
Everything sits in the target file. That file is a long, old module, though, and what the warehouse sends are its WMS_STATUS_* constants (RCV, DSP and six more), while the task lists the statuses as words. A solution is expected to notice the codes in the module and map those.
"""
