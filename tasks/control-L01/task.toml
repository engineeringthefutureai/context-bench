id = "control-L01"
category = "control"
tier = 2   # local edit in a long target file: everything needed is in it
target_file = "shopkit/core/order_engine.py"
needed_helpers = []
repo_sizes = ["L"]

prompt = """
Ops wants readable warehouse states on the phone-order screen. In the order engine module add
`wmsStatusLabel(code)` that returns a short English label for each status code the warehouse sends:
received -> "Received", allocated -> "Allocated", picking -> "Picking", packed -> "Packed",
dispatched -> "Dispatched", short pick -> "Short pick", cancelled -> "Cancelled", on hold ->
"On hold". Codes are matched case-insensitively and surrounding spaces are ignored; anything else
(including None) gives "Unknown".
"""

# For the Tasks page (scripts/build_site.py). Not part of the prompt the models get.
notes = """
The warehouse sends three-letter codes: RCV, ALC, PCK, PKD, DSP, SHT, CNL and HLD. The target module defines them
as WMS_STATUS_* constants, and the function right above the new one uses them. The task names the statuses in words
("received -> Received"), and that reads like a table of codes too. Most runs take the codes from the module. Some
map the words, "received", "picking" and so on, and the hidden tests reject those.

Thinking doesn't settle it. In the v4 round, with thinking off, 10 patches used the codes and 2 the words. With
thinking on it was 14 and 3. Thinking makes the model read the prompt and the code more carefully, yet a reading the
prompt itself makes plausible still goes unquestioned. The Antigravity agent (L-AG) can run code, and it took the
words as well, documenting its choice as "WMS word status code".
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
Everything sits in the target file. That file is a long, old module, though, and what the warehouse sends are its WMS_STATUS_* constants (RCV, DSP and six more). The task lists the statuses as words.
"""
