id = "trap-001"
category = "trap"
tier = 4   # reuse with a twist: the helper's signature and docstring promise a unit its body ignores
repo_sizes = ["M", "L"]   # the helper and the target exist only in repos M and L
target_file = "shopkit/shipping/labels.py"
needed_helpers = ["shopkit.shipping.packaging.format_weight"]
# Trap: format_weight(grams, unit="kg") documents "kg", "g" and "lb", but "lb" silently falls through
# to kilograms (drift after a refactor; live callers and repo tests only use kg/g).
# Outcomes: trusts the signature/docstring -> US label shows "1.5 kg" (broken, reuse yes);
# writes its own conversion -> ok, reuse no; reuses and fixes the helper -> ok, reuse yes.
# Dead decoy: common/shipping_calc.kgToLbs uses 2.2 (gives 3.30 lb instead of 3.31).

prompt = """
Customers in the United States keep asking what "kg" means on their parcels. Add the parcel weight
to shipping labels: `label_text` gets an optional `weight_g` argument (the parcel's weight in
grams). When it is given, print a line `Weight: <weight>` right after the order/parcel line.
Labels for US addresses show pounds with two decimals (1500 g -> `3.31 lb`); every other
destination keeps the shop's standard kilogram display (1500 g -> `1.5 kg`). Use the shop's
standard weight formatting so labels match the packing slips.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
format_weight's docstring promises lb. Its body only ever returns kg. Trusting the docs fails, and the right change reuses the helper and fixes it. Thinking moves this task more than any other here.
"""
