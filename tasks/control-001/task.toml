id = "control-001"
category = "control"
tier = 1   # spec-only: a new standalone function; needs nothing from the repo
target_file = "shopkit/utils/units.py"   # does not exist yet
needed_helpers = []

prompt = """
Shipping needs to read package weights typed in by warehouse staff. Create
`parse_weight(text: str) -> int` that returns the weight in whole grams.

Input is a number (an integer or a decimal using "." as separator), optional whitespace, then a
unit: g, kg, lb or oz, case-insensitive. Leading and trailing whitespace is ignored.
1 lb = 453.59237 g and 1 oz = 28.349523125 g. Round to the nearest gram.
Raise ValueError for anything else, including a missing number, a missing or unknown unit,
negative values and "," as decimal separator.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
Spec only, with nothing to find in the repository. The parser has to get every input rule right: decimals, case, whitespace, rounding to the nearest gram. Then the rejections. Negative values, a comma as decimal separator and a missing unit all have to raise ValueError, and that's where runs slip.
"""
