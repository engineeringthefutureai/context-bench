id = "cross-L01"
category = "cross_file"
tier = 6   # coordinated edits: migration, model, repository, template, API serializer
target_file = "shopkit/orders/models.py"
needed_helpers = []
repo_sizes = ["L"]

prompt = """
Customers can now leave a delivery note for the courier (for example "leave it with the neighbour
at no. 5"). Add `delivery_note: str = ""` to orders and make it work end to end: a new database
migration adds a `delivery_note` column to the orders table (text, empty by default); the order
repository saves the note when an order is added and loads it back; the order page shows it under a
"Delivery note" heading, only when there is one; and the order JSON in the API includes it as
`delivery_note`. Notes are at most 200 characters: storing a longer one raises ValueError.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
One field has to work end to end on repo L. That takes a new SQL migration, saving and loading in the order repository, the HTML order page (only when a note exists), the API serializer and a 200-character limit. Those are five coordinated edits, in a repository far too big to send whole.
"""
