# cross-file: orders/models.py (field), orders/fulfillment.py (Parcel + split + slip),
# api/serializers.py (order dict); invoices/render.py must stay unchanged. models.py imports none.

prompt = """
Shoppers can add a gift message to an order. Add `gift_message: str = ""` to `Order`. The message
must be printed on the packing slip of the order's first parcel only: carry it through
`split_into_parcels` so that `packing_slip(parcel, weight_g)` can print it. The order
representation the API returns must include it as `gift_message`. Customer invoices must not show
it.
"""

# For the Tasks page: what makes the task hard. Not part of the prompt the models get.
challenge = """
The gift message travels from the order through split_into_parcels to the packing slip of the first parcel, and only that one. It also shows up in the API's order. Invoices stay as they are, which makes four places to get right, one of them by leaving it alone.
"""
