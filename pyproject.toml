[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-bench"
version = "0.1.0"
description = "Measuring how context building shapes LLM-written code, from one pasted file to agentic search."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
site = ["markdown>=3.7"]          # scripts/site_layout.py: page content written in Markdown

[project.scripts]
cbench = "context_bench.cli:main"

[tool.setuptools.packages.find]
include = ["context_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
