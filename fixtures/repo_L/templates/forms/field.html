<div class="field{% if f.error %} has-error{% endif %}">
  <label for="f-{{ f.name }}">{{ f.label }}</label>
  {% if f.choices %}
  <select id="f-{{ f.name }}" name="{{ f.name }}">
    {% for c in f.choices %}<option value="{{ c }}"{% if c == f.value %} selected{% endif %}>{{ c }}</option>{% endfor %}
  </select>
  {% else %}
  <input id="f-{{ f.name }}" name="{{ f.name }}" value="{{ f.value }}">
  {% endif %}
  {% if f.error %}<p class="error">{{ f.error }}</p>{% endif %}
</div>
