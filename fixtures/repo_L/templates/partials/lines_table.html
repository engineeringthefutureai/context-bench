<table class="lines">
  <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Total</th></tr></thead>
  <tbody>
    {% for line in lines %}
    <tr>
      <td><span class="title">{{ line.title }}</span> <span class="sku">{{ line.sku }}</span></td>
      <td class="num">{{ line.qty }}</td>
      <td class="num">{{ line.unit_cents|money:order.currency }}</td>
      <td class="num">{{ line.total_cents|money:order.currency }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="empty">No items.</td></tr>
    {% endfor %}
  </tbody>
  <tfoot>
    <tr><th colspan="3">Total</th><td class="num total">{{ order.total_cents|money:order.currency }}</td></tr>
  </tfoot>
</table>
