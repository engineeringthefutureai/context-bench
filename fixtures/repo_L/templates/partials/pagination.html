<nav class="pagination">
  {% if prev_offset != None %}<a rel="prev" href="?offset={{ prev_offset }}{% if status %}&amp;status={{ status }}{% endif %}">Previous</a>{% endif %}
  <span class="count">{{ total|pluralize:"order" }}</span>
  {% if next_offset %}<a rel="next" href="?offset={{ next_offset }}{% if status %}&amp;status={{ status }}{% endif %}">Next</a>{% endif %}
</nav>
