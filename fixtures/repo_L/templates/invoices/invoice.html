{% extends "base.html" %}
{% block content %}
<article class="invoice">
  <header>
    <h1>Invoice {{ number }}</h1>
    <p>Issued <time>{{ issued|date }}</time> · Order {{ order.id }}</p>
    <address class="bill-to">{{ bill_to }}</address>
  </header>
  {% include "partials/lines_table.html" %}
  <p class="terms">Payment received with thanks. Keep this invoice for your records.</p>
</article>
{% endblock %}
