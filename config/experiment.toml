# Experiment configuration. Paths are relative to the project root.

[paths]
tasks = "tasks"
helpers = "helpers/registry.toml"
results = "results/results.jsonl"
patches = "results/patches"
cache = ".cache"
package_roots = ["shopkit"]          # top-level packages of the test repo (for hallucination checks)

[repos]
S = "fixtures/repo_S"                # ~8k tokens target
# M = "fixtures/repo_M"              # ~30k tokens (milestone 6)
# L = "fixtures/repo_L"              # ~100k tokens

# Any OpenAI-compatible chat endpoint (e.g. a local llama.cpp server). Names below are placeholders.
[models.current-30b]
base_url = "http://localhost:8080"
model = "CHANGE-ME-current-30b"
quant = "Q4_K_M"
context_window = 32768

[models.current-8b]
base_url = "http://localhost:8082"
model = "CHANGE-ME-current-8b"
quant = "Q4_K_M"
context_window = 32768

# Optional model axis: early-2026 model of the same family and size.
# [models.early2026-30b]
# base_url = "http://localhost:8083"
# model = "CHANGE-ME-early2026-30b"
# quant = "Q4_K_M"
# context_window = 32768

[embedder]                           # any OpenAI-compatible /v1/embeddings endpoint
base_url = "http://localhost:8081"
model = "CHANGE-ME-embedding-model"

[generation]
temperature = 0.2
max_output_tokens = 4096

[sweep]
models = ["current-30b", "current-8b"]
seeds = [1, 2, 3]
default_repo_sizes = ["S"]

# One [[config]] per configuration in the sweep. Optional keys:
# retriever, query_mode, agent_variant, prompt_arm, categories (task filter), repo_sizes, models.

[[config]]
level = "L0"
categories = ["control"]

[[config]]
level = "L1"

[[config]]
level = "L1"
prompt_arm = "reuse_hint"

[[config]]
level = "L2"

[[config]]
level = "L3"
repo_sizes = ["S"]                   # add "M", "L" once those repos exist

[[config]]
level = "L4"
retriever = "bm25"

[[config]]
level = "L4"
retriever = "embed"

[[config]]
level = "L5"
retriever = "bm25"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_summary"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "draft_then_search"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"
prompt_arm = "reuse_hint"

[[config]]
level = "L6"

[[config]]
level = "L7"

[[config]]
level = "L8"
agent_variant = "grep"

[[config]]
level = "L8"
agent_variant = "hybrid"
retriever = "embed"                  # powers the semantic_search tool
