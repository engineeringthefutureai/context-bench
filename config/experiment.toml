# Experiment configuration. Paths are relative to the project root.

[paths]
tasks = "tasks"
helpers = "helpers/registry.toml"
results = "results/results.jsonl"
runs = "results/runs"                # per-run bundles (context_bench/bundle.py)
grades = "results/grades.jsonl"
cache = ".cache"
package_roots = ["shopkit"]          # top-level packages of the test repo

[repos]
S = "fixtures/repo_S"                # ~2k tokens: the seed repo
M = "fixtures/repo_M"                # ~40.6k tokens at L3 (L6 map: ~10.6k): superset of S (S files unchanged), 25 helpers + decoys
L = "fixtures/repo_L"                # 169k tokens at L3 (NO FIT; L6 map 26k): shopkit a year after M, docs/repo-L-design.md

# Any OpenAI-compatible chat endpoint (e.g. a local llama.cpp server).
[models."qwen3.8-27b"]
base_url = "http://localhost:8080"
model = "Qwen/Qwen3.8-27B-Q6"        # the server's --alias (id at /v1/models); file: Qwen3.8-27B-UD-Q6_K_XL.gguf
quant = "UD-Q6_K_XL, KV cache q8_0"  # weights + -ctk/-ctv as served
context_window = 131072              # 128k per request: llama-server -c 131072 -np 1
                                     # (with -np N each slot only gets -c/N)

# Same model family and size served by vLLM: FP8 weights, tensor parallel over both B60s.
# Shares port 8080 with the llama.cpp entry above; only one of the two servers runs at a time.
[models."qwen3.8-27b-fp8"]
base_url = "http://localhost:8080"
base_urls = ["http://localhost:8080", "http://localhost:8080"]
                                       # same server 2x = 2 concurrent requests (vLLM batches them);
                                       # latency_s then includes shared load. 4x until 2026-11-23
                                       # (S, M and the start of L's thinking-off pass); 2x for repo L's
                                       # long contexts. Not part of run_id; each run records `concurrency`.
model = "Qwen/Qwen3.8-27B"           # --served-model-name
quant = "FP8 (vLLM, TP=2, kv auto, MTP speculative decoding: 4 draft tokens)"
context_window = 98304               # --max-model-len

# Small, fast model for quick harness checks (Ollama's OpenAI-compatible API); not the model under study.
[models."llama3.2-3b"]
base_url = "http://localhost:11434"
model = "llama3.2:3b"
quant = "Q4_K_M"
context_window = 131072              # as loaded by Ollama (GET /api/ps context_length)

[models."qwen3-8b"]
base_url = "http://localhost:11434"
base_urls = ["http://localhost:11434", "http://localhost:11435"]   # one Ollama per B60, same -c; sweep runs both
model = "qwen3:8b"
quant = "Q4_K_M"
context_window = 40960               # qwen3:8b's trained context; check GET /api/ps once loaded

# Later: a second size, or an older Qwen of the same size (27B, same quant) for the model axis.
# [models.older-27b]
# base_url = "http://localhost:8083"
# model = "CHANGE-ME"
# quant = "UD-Q6_K_XL"
# context_window = 98304

[embedder]                           # any OpenAI-compatible /v1/embeddings endpoint
base_url = "http://localhost:21434"  # Ollama on the iGPU (Vulkan device 0, OLLAMA_IGPU_ENABLE=1)
api = "ollama"                       # Ollama's /api/embed with truncate=false: too-long input is an error, never cut
# EmbeddingGemma 2 from 2026-11-23 (before: qwen3-embedding:0.6b with the query instruction below).
model = "embeddinggemma-2:latest"
# EmbeddingGemma's task format: both sides get a prefix.
query_prefix = "task: code retrieval | query: "
document_prefix = "title: none | text: "
# Never truncated (api = "ollama" sends truncate=false). EmbeddingGemma takes 8k tokens when Ollama's window
# and batch are raised to match (context_tokens; the default batch of 2048 cut inputs silently).
context_tokens = 8192
# Whole files (L4) longer than max_chars become overlapping line windows (a file scores as its best window);
# a window still too long is halved. Functions/classes are never split: one that doesn't fit stops the index
# build and is named. Windows are ~4k tokens (~10k chars of code), well inside the 8k window; functions use
# the whole 8k.
max_chars = 10000
overlap_chars = 1000
# qwen3-embedding:0.6b (rounds up to v4 thinking-off, 2026-11-23): queries only
# query_prefix = "Instruct: Given a change request, retrieve code from the repository that is relevant to implementing it\nQuery: "

[bulk_index]                         # cbench index --embeddings --bulk: one Ollama per B60, through the GPU
                                     # manager (ARIES_MANAGER_URL, ARIES_CLIENT_TOKEN in .env). Loading them
                                     # evicts vLLM; it is loaded again afterwards. Same model as [embedder].
profiles = ["ollama-b60-1", "ollama-b60-2"]
base_urls = ["http://localhost:11435", "http://localhost:11436"]

[generation]
# temperature: unset = the server's default (not sent). Set it here for a more controlled run later.
max_output_tokens = 32768            # includes the model's thinking (Qwen reasons before answering)
thinking = false                     # development: off (fast). Final round: true, or cbench run --thinking

[grading]                            # cbench grade: blind judge, one per task
# agy (Antigravity CLI), recorded as `judge` on every grade. Plan mode (no edits) in a sandbox; headless
# mode can't ask for permissions, so read-only commands are allowed for this session only (never saved).
# -p must come last: the prompt is appended right after it. Calibrated against the Claude judge on 3
# tasks (2026-11-22): ranking correlation +1.00 / +0.86 / +0.82, every correctness call the same.
judge = "agy"
judge_command = ["agy", "--output-format", "json", "--mode", "plan", "--sandbox", "--settings",
                 '{"permissions": {"allow": ["command(echo)", "command(ls)", "command(find)", "command(grep)", "command(cat)", "command(head)", "command(tail)", "command(sort)", "command(uniq)", "command(wc)", "command(sed)", "command(diff)", "command(nl)", "command(tree)", "command(awk)", "command(cut)"]}}',
                 "-p"]
# Claude Code judge (used for all grades before 2026-11-22): only Read/Grep/Glob, nothing outside its
# dir, no user/project settings or CLAUDE.md.
# judge = "claude"
# judge_command = ["claude", "-p", "--output-format", "json", "--tools", "Read,Grep,Glob",
#                  "--permission-mode", "dontAsk", "--setting-sources", ""]
rubric = "grading/rubric.md"
work_dir = "/tmp/cbench-judge"       # outside the project tree; one subdir per task, wiped each time
# Penalty grading (cbench grade --mode penalty --judge NAME): one call per passing patch, catalogue below.
penalty_catalogue = "grading/penalties.md"

[grading.judges]                     # --judge NAME picks one; recorded as `judge` on every penalty grade
agy = ["agy", "--output-format", "json", "--mode", "plan", "--sandbox", "--settings",
                 '{"permissions": {"allow": ["command(echo)", "command(ls)", "command(find)", "command(grep)", "command(cat)", "command(head)", "command(tail)", "command(sort)", "command(uniq)", "command(wc)", "command(sed)", "command(diff)", "command(nl)", "command(tree)", "command(awk)", "command(cut)"]}}',
                 "-p"]
claude = ["claude", "-p", "--output-format", "json", "--tools", "Read,Grep,Glob",
          "--permission-mode", "dontAsk", "--setting-sources", ""]

[sweep]
models = ["qwen3.8-27b"]             # start simple: one model, one shot per config
seeds = [1]
default_repo_sizes = ["S", "M", "L"]

# One [[config]] per configuration in the sweep. Optional keys:
# retriever, query_mode, agent_variant, map_docs, thinking, prompt_arm, categories / tiers (task filters),
# repo_sizes, models.

[[config]]
level = "L0"
categories = ["control"]
tiers = [1]                          # L0 can only create new files; tier-2 edits need the file
repo_sizes = "smallest"              # L0-L2 prompts only show the task's own files, which are
                                     # the same in S and M: run once, on the smallest repo the
                                     # task fits (S tasks on S; M-only tasks on M)

[[config]]
level = "L1"
repo_sizes = "smallest"

[[config]]
level = "L1"
prompt_arm = "reuse_hint"
repo_sizes = "smallest"

[[config]]
level = "L2"
repo_sizes = "smallest"

[[config]]
level = "L3"

[[config]]
level = "L4"
retriever = "bm25"

[[config]]
level = "L4"
retriever = "embed"

[[config]]
level = "L5"
retriever = "bm25"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_summary"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "draft_then_search"

[[config]]
level = "L5"
retriever = "bm25"
query_mode = "model_queries"         # model writes the search queries in a planning call

[[config]]
level = "L5"
retriever = "embed"
query_mode = "model_queries"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"
prompt_arm = "reuse_hint"

[[config]]
level = "L6"                         # signatures only

[[config]]
level = "L6"
map_docs = true                      # + first docstring line ("L6+docs")

# (symbol graph: deprioritized, see context_bench/levels/lx_symbol_graph.py)

[[config]]
level = "L7"
agent_variant = "grep"
failed_call_cost = 0.5               # a failed tool call costs half a call and gets feedback

# (The "L7 grep thinking" arm, which ran thinking on in thinking-off sweeps, was dropped 2026-11-23:
# thinking is used only in the thinking-on round.)

[[config]]
level = "L7"
agent_variant = "hybrid"
failed_call_cost = 0.5
retriever = "embed"                  # powers the semantic_search tool

[[config]]                           # hybrid's tools, richer: search hits with source, ranged reads,
level = "L7"                         # references with their enclosing function. Append-only.
agent_variant = "rich"
failed_call_cost = 0.5
retriever = "embed"

[[config]]                           # rich + drop: results get IDs, the latest batch can be dropped
level = "L7"                         # (stubbed); one working-set line in the tool note
agent_variant = "selective"
failed_call_cost = 0.5
retriever = "embed"

[[config]]                           # L8, experimental: selective's dropping, the symbol list instead of the
level = "L8"                         # tree, read_symbol as the only reader (names, "path:a-b"), changes made
agent_variant = "edit"               # with the edit / create_file tools (prompt arm edit_tools; rule 1 exception)
prompt_arm = "edit_tools"
failed_call_cost = 0.5
retriever = "embed"
