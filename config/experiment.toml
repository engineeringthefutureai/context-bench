# Experiment configuration. Paths are relative to the project root.

[paths]
tasks = "tasks"
helpers = "helpers/registry.toml"
results = "results/results.jsonl"
runs = "results/runs"                # per-run bundles (context_bench/bundle.py)
grades = "results/grades.jsonl"
cache = ".cache"
package_roots = ["shopkit"]          # top-level packages of the test repo

[repos]
S = "fixtures/repo_S"                # ~2k tokens: the seed repo
M = "fixtures/repo_M"                # ~40.6k tokens at L3 (L6 map: ~10.6k): superset of S (S files unchanged), 25 helpers + decoys

# Any OpenAI-compatible chat endpoint (e.g. a local llama.cpp server).
[models."qwen3.8-27b"]
base_url = "http://localhost:8080"
model = "Qwen/Qwen3.8-27B-Q6"        # the server's --alias (id at /v1/models); file: Qwen3.8-27B-UD-Q6_K_XL.gguf
quant = "UD-Q6_K_XL, KV cache q8_0"  # weights + -ctk/-ctv as served
context_window = 131072              # 128k per request: llama-server -c 131072 -np 1
                                     # (with -np N each slot only gets -c/N)

# Same model family and size served by vLLM: FP8 weights, tensor parallel over both B60s.
# Shares port 8080 with the llama.cpp entry above; only one of the two servers runs at a time.
[models."qwen3.8-27b-fp8"]
base_url = "http://localhost:8080"
base_urls = ["http://localhost:8080", "http://localhost:8080", "http://localhost:8080",
             "http://localhost:8080"]  # same server 4x = 4 concurrent requests (vLLM batches them);
                                       # latency_s then includes shared load
model = "Qwen/Qwen3.8-27B"           # --served-model-name
quant = "FP8 (vLLM, TP=2, kv auto)"
context_window = 98304               # --max-model-len

# Small, fast model for quick harness checks (Ollama's OpenAI-compatible API); not the model under study.
[models."llama3.2-3b"]
base_url = "http://localhost:11434"
model = "llama3.2:3b"
quant = "Q4_K_M"
context_window = 131072              # as loaded by Ollama (GET /api/ps context_length)

[models."qwen3-8b"]
base_url = "http://localhost:11434"
base_urls = ["http://localhost:11434", "http://localhost:11435"]   # one Ollama per B60, same -c; sweep runs both
model = "qwen3:8b"
quant = "Q4_K_M"
context_window = 40960               # qwen3:8b's trained context; check GET /api/ps once loaded

# Later: a second size, or an older Qwen of the same size (27B, same quant) for the model axis.
# [models.older-27b]
# base_url = "http://localhost:8083"
# model = "CHANGE-ME"
# quant = "UD-Q6_K_XL"
# context_window = 98304

[embedder]                           # any OpenAI-compatible /v1/embeddings endpoint
base_url = "http://localhost:8081"
model = "CHANGE-ME-embedding-model"

[generation]
# temperature: unset = the server's default (not sent). Set it here for a more controlled run later.
max_output_tokens = 32768            # includes the model's thinking (Qwen reasons before answering)
thinking = false                     # development: off (fast). Final round: true, or cbench run --thinking

[grading]                            # cbench grade: blind judge, one per task
# Confined: only Read/Grep/Glob, nothing outside its dir, no user/project settings or CLAUDE.md.
judge_command = ["claude", "-p", "--output-format", "json", "--tools", "Read,Grep,Glob",
                 "--permission-mode", "dontAsk", "--setting-sources", ""]
rubric = "grading/rubric.md"
work_dir = "/tmp/cbench-judge"       # outside the project tree; one subdir per task, wiped each time

[sweep]
models = ["qwen3.8-27b"]             # start simple: one model, one shot per config
seeds = [1]
default_repo_sizes = ["S", "M"]

# One [[config]] per configuration in the sweep. Optional keys:
# retriever, query_mode, agent_variant, map_docs, thinking, prompt_arm, categories / tiers (task filters),
# repo_sizes, models.

[[config]]
level = "L0"
categories = ["control"]
tiers = [1]                          # L0 can only create new files; tier-2 edits need the file
repo_sizes = ["S"]                   # M has every S file unchanged, so L0-L2 prompts are
                                     # identical on M: running them there only repeats S

[[config]]
level = "L1"
repo_sizes = ["S"]

[[config]]
level = "L1"
prompt_arm = "reuse_hint"
repo_sizes = ["S"]

[[config]]
level = "L2"
repo_sizes = ["S"]

[[config]]
level = "L3"

[[config]]
level = "L4"
retriever = "bm25"

[[config]]
level = "L4"
retriever = "embed"

[[config]]
level = "L5"
retriever = "bm25"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_summary"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "draft_then_search"

[[config]]
level = "L5"
retriever = "bm25"
query_mode = "model_queries"         # model writes the search queries in a planning call

[[config]]
level = "L5"
retriever = "embed"
query_mode = "model_queries"

[[config]]
level = "L5"
retriever = "embed"
query_mode = "task_vs_code"
prompt_arm = "reuse_hint"

[[config]]
level = "L6"                         # signatures only

[[config]]
level = "L6"
map_docs = true                      # + first docstring line ("L6+docs")

[[config]]
level = "L7"

[[config]]
level = "L8"
agent_variant = "grep"

[[config]]
level = "L8"
agent_variant = "hybrid"
retriever = "embed"                  # powers the semantic_search tool
